<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDDC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>VDDC</h2>

  <select id="group">
    <option value="">Select Drug Group</option>
  </select>

  <select id="drug">
    <option value="">Select Drug</option>
  </select>

  <select id="species">
    <option value="">Select Species</option>
  </select>

  <input type="number" id="weight" placeholder="Body weight (kg)" step="0.1" min="0">

  <div class="result" id="output"></div>

  <hr>

  <h3>Drug Reconstitution &amp; Volume</h3>

  <input type="number" id="customMg" placeholder="Total drug to give (mg) – optional" min="0" step="any">
  <input type="number" id="vialMg" placeholder="Total drug in vial (mg)" min="0" step="any">
  <input type="number" id="vialMl" placeholder="Total vial volume (mL)" min="0" step="any">

  <div class="result" id="customOutput"></div>

  <hr>

  <h3>QUICK PANEL</h3>
  <div class="result" id="manualOnlyOutput"></div>

  <script src="script.js"></script>
</body>
</html>
